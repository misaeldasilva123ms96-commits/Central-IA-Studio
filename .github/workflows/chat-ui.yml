name: Regressao de chat e layout
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chat-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/check_chat_regressions.py
        env:
          CENTRAL_USE_BUNDLED_BROWSER: '1'
      - run: python tests/browser/check_features04.py
        env:
          CENTRAL_USE_BUNDLED_BROWSER: '1'
      - run: python tests/browser/check_catalog05.py
        env:
          CENTRAL_USE_BUNDLED_BROWSER: '1'
      - run: python tests/browser/check_work_panel.py
        env:
          CENTRAL_USE_BUNDLED_BROWSER: '1'
          CENTRAL_QA_DIR: ${{ runner.temp }}/central-work-panel-qa
      - run: python tests/browser/check_presets_context.py
        env:
          CENTRAL_USE_BUNDLED_BROWSER: '1'
          CENTRAL_QA_DIR: ${{ runner.temp }}/central-presets-context-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chat-layout-regressions
          path: |
            work/qa/
            ${{ runner.temp }}/central-work-panel-qa/
            ${{ runner.temp }}/central-presets-context-qa/
