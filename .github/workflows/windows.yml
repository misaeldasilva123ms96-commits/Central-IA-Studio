name: Validar e empacotar Windows x64
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: d1044bc82712fbf08996080bef6298b24a27e9c7
          path: work/llama-upstream
      - run: python -m pip install -r engine/tests/requirements.txt
      - name: Verificar se o motor continua identico ao build aprovado
        id: engine_source
        shell: pwsh
        run: |
          $same = (git rev-parse HEAD:engine) -eq '569d274c6efd064a2ce9ffaed17b993e91c99a32'
          "reuse=$($same.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Recuperar motor aprovado quando as fontes forem identicas
        id: engine_cache
        if: steps.engine_source.outputs.reuse == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $approvedBuild = gh run view 41769219990 --json conclusion,headSha | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $approvedBuild.conclusion -ne 'success') { throw 'Build aprovado indisponivel; compilacao sera executada' }
          $approvedTree = gh api "repos/$env:GH_REPO/git/trees/$($approvedBuild.headSha)" | ConvertFrom-Json
          $approvedEngineTree = ($approvedTree.tree | Where-Object path -eq 'engine').sha
          if ($LASTEXITCODE -ne 0 -or $approvedEngineTree -ne '569d274c6efd064a2ce9ffaed17b993e91c99a32') { throw 'Fontes do motor divergentes; compilacao sera executada' }
          gh run download 41769219990 -n Central-Engine-Windows-x64-CPU -D work/engine-package
          if ($LASTEXITCODE -ne 0) { throw 'Motor anterior indisponivel; compilacao sera executada' }
          python -c "import hashlib; from pathlib import Path; root=Path('work/engine-package'); rows=(root/'SHA256SUMS.txt').read_text().splitlines(); assert all(hashlib.sha256((root/n).read_bytes()).hexdigest()==h for h,n in (row.split('  ',1) for row in rows))"
          if ($LASTEXITCODE -ne 0) { throw 'Hash incorreto; compilacao sera executada' }
      - name: Compilar Central Engine CPU x64
        if: steps.engine_cache.outcome != 'success'
        shell: pwsh
        run: |
          cmake -S engine -B work/engine-build -G "Visual Studio 17 2022" -A x64 -DCENTRAL_LLAMA_SOURCE="$PWD/work/llama-upstream"
          if ($LASTEXITCODE -ne 0) { throw 'CMake falhou' }
          cmake --build work/engine-build --config Release --target central-engine-nocuda --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Compilacao do motor falhou' }
      - name: Testar inferencia real com pesos aleatorios
        shell: pwsh
        run: |
          python engine/tests/make_tiny_gguf.py work/llama-upstream work/tiny.gguf
          if ($LASTEXITCODE -ne 0) { throw 'Fixture falhou' }
          $binary = if ('${{ steps.engine_cache.outcome }}' -eq 'success') { 'work/engine-package/central-engine-nocuda.exe' } else { 'work/engine-build/bin/Release/central-engine-nocuda.exe' }
          python engine/tests/test_engine_http.py $binary work/tiny.gguf
          if ($LASTEXITCODE -ne 0) { throw 'Teste real do motor falhou' }
      - if: steps.engine_cache.outcome != 'success'
        run: python engine/scripts/package_engine.py work/engine-build/bin/Release/central-engine-nocuda.exe work/llama-upstream work/engine-package

      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m pytest -q
      - run: python scripts/python_notices.py
      - run: python scripts/package_source.py
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - shell: pwsh
        run: |
          Expand-Archive 'Central-IA-Studio-Windows-x64.zip' 'work/package smoke'
          $packageRoot = Join-Path $PWD 'work/package smoke'
          $packageTop = @(Get-ChildItem $packageRoot -Name)
          if ($packageTop.Count -ne 3 -or !(Test-Path (Join-Path $packageRoot 'ABRIR_CENTRAL_IA.cmd')) -or !(Test-Path (Join-Path $packageRoot 'LEIA-ME.txt'))) { throw 'Pasta inicial do pacote deve conter apenas iniciador, guia e CentralIAStudio' }
          $expectedVersion = (Get-Content 'frontend/package.json' -Raw | ConvertFrom-Json).version
          $exe = Join-Path $PWD 'work/package smoke/CentralIAStudio/CentralIAStudio.exe'
          $process = Start-Process $exe -ArgumentList '--no-browser' -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 20; $i++) {
              try {
                $r = Invoke-RestMethod 'http://127.0.0.1:8765/api/bootstrap'
                if ($r.version -eq $expectedVersion) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (!$ready) { throw 'Executavel empacotado nao iniciou' }
            if (!$r.settings.executable.EndsWith('central-engine-nocuda.exe')) { throw 'Motor incluido nao foi detectado' }
            if (!(Test-Path $r.settings.executable)) { throw 'Executavel do motor ausente' }
            $page = Invoke-WebRequest 'http://127.0.0.1:8765/'
            if (!$page.Content.Contains('Central IA Studio')) { throw 'Frontend ausente' }
            $releaseHeaders = @{ 'X-Central-Token' = $r.token }
            $attachmentFile = Join-Path $PWD 'work/package smoke/anexo.txt'
            Set-Content $attachmentFile 'Arquivo de teste do EXE empacotado' -Encoding utf8
            $releaseAttachment = Invoke-RestMethod 'http://127.0.0.1:8765/api/attachments?name=anexo.txt' -Method Post -Headers $releaseHeaders -ContentType 'application/octet-stream' -InFile $attachmentFile
            if ($releaseAttachment.kind -ne 'document') { throw 'Extrator de anexos do EXE falhou' }
            $imageFile = Join-Path $PWD 'work/package smoke/imagem.png'
            python -c "from PIL import Image; Image.new('RGB',(16,16),'red').save(r'$imageFile')"
            if ($LASTEXITCODE -ne 0) { throw 'Fixture PNG falhou' }
            $releaseImage = Invoke-RestMethod 'http://127.0.0.1:8765/api/attachments?name=imagem.png' -Method Post -Headers $releaseHeaders -ContentType 'application/octet-stream' -InFile $imageFile
            if ($releaseImage.kind -ne 'image') { throw 'Leitor de imagens do EXE falhou' }
            $pdfFile = Join-Path $PWD 'work/package smoke/documento.pdf'
            python -c "from pypdf import PdfWriter; w=PdfWriter(); w.add_blank_page(width=100,height=100); w.write(r'$pdfFile')"
            if ($LASTEXITCODE -ne 0) { throw 'Fixture PDF falhou' }
            $releasePdf = Invoke-RestMethod 'http://127.0.0.1:8765/api/attachments?name=documento.pdf' -Method Post -Headers $releaseHeaders -ContentType 'application/octet-stream' -InFile $pdfFile
            if ($releasePdf.kind -ne 'document') { throw 'Leitor PDF do EXE falhou' }
            Write-Host 'Studio EXE: extracao isolada de texto, PNG e PDF passou.'
            $exampleZip = Join-Path $PWD 'work/package smoke/plugin-example.zip'
            Invoke-WebRequest 'http://127.0.0.1:8765/central-demo-plugin.zip' -OutFile $exampleZip
            $previewPlugin = Invoke-RestMethod 'http://127.0.0.1:8765/api/extensions/import?name=demo.zip' -Method Post -Headers $releaseHeaders -ContentType 'application/octet-stream' -InFile $exampleZip
            if ($previewPlugin.name -ne 'central-demo') { throw 'Preview do plugin no EXE falhou' }
            $installHeaders = @{ 'X-Central-Token' = $r.token; 'X-Import-Digest' = $previewPlugin.digest }
            $installedPlugin = Invoke-RestMethod 'http://127.0.0.1:8765/api/extensions/import?name=demo.zip&confirm=true' -Method Post -Headers $installHeaders -ContentType 'application/octet-stream' -InFile $exampleZip
            $mcpId = $installedPlugin.servers[0].id
            if ($installedPlugin.servers[0].connected) { throw 'Importacao iniciou servidor sem consentimento' }
            $mcpConnected = Invoke-RestMethod "http://127.0.0.1:8765/api/mcp/$mcpId/connect" -Method Post -Headers $releaseHeaders -ContentType 'application/json' -Body '{"confirmed":true}'
            if (!$mcpConnected.servers[0].connected -or $mcpConnected.servers[0].tools[0].name -ne 'demo_sum') { throw 'SDK MCP do EXE congelado nao conectou/descobriu ferramentas' }
            Invoke-RestMethod "http://127.0.0.1:8765/api/mcp/$mcpId/disconnect" -Method Post -Headers $releaseHeaders -ContentType 'application/json' -Body '{}' | Out-Null
            Invoke-RestMethod "http://127.0.0.1:8765/api/extensions/$($installedPlugin.id)" -Method Patch -Headers $releaseHeaders -ContentType 'application/json' -Body '{"action":"disable"}' | Out-Null
            Write-Host 'Studio EXE: importacao portavel, consentimento e MCP STDIO real passaram.'

            $releaseModelDir = Join-Path $PWD 'work/package smoke/modelo de teste'
            New-Item -ItemType Directory -Force $releaseModelDir | Out-Null
            $releaseModelPath = Join-Path $releaseModelDir 'tiny.gguf'
            Copy-Item 'work/tiny.gguf' $releaseModelPath
            $folderListing = Invoke-RestMethod ('http://127.0.0.1:8765/api/folders?path=' + [uri]::EscapeDataString($releaseModelDir))
            if ($folderListing.path -ne [IO.Path]::GetFullPath($releaseModelDir)) { throw 'Seletor de pastas do EXE empacotado falhou' }
            $releaseSettings = @{engine_url='http://127.0.0.1:5001'; executable=$r.settings.executable; folders=@($releaseModelDir)}
            Invoke-RestMethod 'http://127.0.0.1:8765/api/settings' -Method Put -Headers $releaseHeaders -ContentType 'application/json' -Body ($releaseSettings | ConvertTo-Json) | Out-Null
            # Keep the tiny byte-token fixture's context focused on native inference.
            $releaseExtensions = Invoke-RestMethod 'http://127.0.0.1:8765/api/extensions'
            foreach ($extension in $releaseExtensions.items) {
              if ($extension.enabled) { Invoke-RestMethod "http://127.0.0.1:8765/api/extensions/$($extension.id)" -Method Patch -Headers $releaseHeaders -ContentType 'application/json' -Body '{"action":"disable"}' | Out-Null }
            }
            $releaseProfile = $r.profile
            $releaseProfile.cache_kv = 'f16'; $releaseProfile.flash_attention = $false; $releaseProfile.max_output = 8
            $releaseStarted = Invoke-RestMethod 'http://127.0.0.1:8765/api/engine/start' -Method Post -Headers $releaseHeaders -ContentType 'application/json' -Body (@{path=$releaseModelPath; profile=$releaseProfile} | ConvertTo-Json)
            $releaseEnginePid = $releaseStarted.pid
            $releaseConnected = $false
            for ($i=0; $i -lt 30; $i++) {
              $releaseStatus = Invoke-RestMethod 'http://127.0.0.1:8765/api/engine'
              if ($releaseStatus.connected) { $releaseConnected = $true; break }
              Start-Sleep -Seconds 1
            }
            if (!$releaseConnected) { throw 'Studio EXE nao conectou ao motor incluido' }
            $releaseConversation = Invoke-RestMethod 'http://127.0.0.1:8765/api/conversations' -Method Post -Headers $releaseHeaders -ContentType 'application/json' -Body '{"title":"Teste EXE com motor"}'
            $releaseReply = Invoke-WebRequest 'http://127.0.0.1:8765/api/generate' -Method Post -Headers $releaseHeaders -ContentType 'application/json' -Body (@{conversation=$releaseConversation.id; content='Teste real do pacote'; profile=$releaseProfile} | ConvertTo-Json)
            if (!$releaseReply.Content.Contains('event: done') -or $releaseReply.Content.Contains('event: error')) { throw 'Chat pelo Studio EXE falhou' }
            $releaseHistory = Invoke-RestMethod "http://127.0.0.1:8765/api/conversations/$($releaseConversation.id)"
            if ($null -eq $releaseHistory[-1].stats.generated_tokens) { throw 'Tokens nao registrados pelo Studio EXE' }
            Invoke-RestMethod 'http://127.0.0.1:8765/api/engine/stop' -Method Post -Headers $releaseHeaders -ContentType 'application/json' -Body '{}' | Out-Null
            Write-Host 'Studio EXE -> Central Engine incluido -> GGUF aleatorio -> SSE -> SQLite: passou.'

            Invoke-WebRequest 'http://127.0.0.1:8765/api/source' -OutFile 'work/bundled-source.zip'
            python -c "from zipfile import ZipFile; z=ZipFile('work/bundled-source.zip'); assert z.testzip() is None; assert 'backend/app.py' in z.namelist(); assert 'scripts/package_windows.py' in z.namelist()"
            if ($LASTEXITCODE -ne 0) { throw 'Fontes correspondentes ausentes' }
          } finally {
            if ($releaseEnginePid) { Stop-Process -Id $releaseEnginePid -ErrorAction SilentlyContinue }
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Central-IA-Studio-Windows-x64
          path: |
            Central-IA-Studio-Windows-x64.zip
            Central-IA-Studio-Fontes-e-Documentacao.zip
            SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Central-Engine-Windows-x64-CPU
          path: work/engine-package/
