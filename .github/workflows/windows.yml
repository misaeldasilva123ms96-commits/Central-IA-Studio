name: Validar e empacotar Windows x64
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: d1044bc82712fbf08996080bef6298b24a27e9c7
          path: work/llama-upstream
      - run: python -m pip install -r engine/tests/requirements.txt
      - name: Verificar se o motor continua identico ao build aprovado
        id: engine_source
        shell: pwsh
        run: |
          # The second immutable tree only adapts the tiny Studio smoke fixture
          # to preinstalled extensions. CMake, C++ and all build/package scripts
          # are identical to the approved tree; any other tree forces a rebuild.
          $same = (git rev-parse HEAD:engine) -in @('569d274c6efd064a2ce9ffaed17b993e91c99a32','af6a8fecca0582bc0b33b535fc57f5c2075a890f')
          "reuse=$($same.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Recuperar motor aprovado quando as fontes forem identicas
        id: engine_cache
        if: steps.engine_source.outputs.reuse == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $approvedBuild = gh run view 41769219990 --json conclusion,headSha | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $approvedBuild.conclusion -ne 'success') { throw 'Build aprovado indisponivel; compilacao sera executada' }
          $approvedTree = gh api "repos/$env:GH_REPO/git/trees/$($approvedBuild.headSha)" | ConvertFrom-Json
          $approvedEngineTree = ($approvedTree.tree | Where-Object path -eq 'engine').sha
          if ($LASTEXITCODE -ne 0 -or $approvedEngineTree -ne '569d274c6efd064a2ce9ffaed17b993e91c99a32') { throw 'Fontes do motor divergentes; compilacao sera executada' }
          gh run download 41769219990 -n Central-Engine-Windows-x64-CPU -D work/engine-package
          if ($LASTEXITCODE -ne 0) { throw 'Motor anterior indisponivel; compilacao sera executada' }
          python -c "import hashlib; from pathlib import Path; root=Path('work/engine-package'); rows=(root/'SHA256SUMS.txt').read_text().splitlines(); assert all(hashlib.sha256((root/n).read_bytes()).hexdigest()==h for h,n in (row.split('  ',1) for row in rows))"
          if ($LASTEXITCODE -ne 0) { throw 'Hash incorreto; compilacao sera executada' }
      - name: Compilar Central Engine CPU x64
        if: steps.engine_cache.outcome != 'success'
        shell: pwsh
        run: |
          cmake -S engine -B work/engine-build -G "Visual Studio 17 2022" -A x64 -DCENTRAL_LLAMA_SOURCE="$PWD/work/llama-upstream"
          if ($LASTEXITCODE -ne 0) { throw 'CMake falhou' }
          cmake --build work/engine-build --config Release --target central-engine-nocuda --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Compilacao do motor falhou' }
      - name: Testar inferencia real com pesos aleatorios
        shell: pwsh
        run: |
          python engine/tests/make_tiny_gguf.py work/llama-upstream work/tiny.gguf
          if ($LASTEXITCODE -ne 0) { throw 'Fixture falhou' }
          $binary = if ('${{ steps.engine_cache.outcome }}' -eq 'success') { 'work/engine-package/central-engine-nocuda.exe' } else { 'work/engine-build/bin/Release/central-engine-nocuda.exe' }
          python engine/tests/test_engine_http.py $binary work/tiny.gguf
          if ($LASTEXITCODE -ne 0) { throw 'Teste real do motor falhou' }
      - if: steps.engine_cache.outcome != 'success'
        run: python engine/scripts/package_engine.py work/engine-build/bin/Release/central-engine-nocuda.exe work/llama-upstream work/engine-package

      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m pytest -q
      - run: python scripts/python_notices.py
      - run: python scripts/package_source.py
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Preparar navegador e servidor MCP independente para testes
        shell: pwsh
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Navegador de teste indisponivel' }
          python -m PyInstaller --noconfirm --clean --onefile --console --noupx --name mcp-fixture --distpath work/smoke-tools --workpath work/mcp-fixture-build --specpath work/mcp-fixture-spec examples/extensions/central-demo/server.py
          if ($LASTEXITCODE -ne 0) { throw 'Fixture MCP independente falhou' }
      - name: Habilitar firewall para isolar os aplicativos de teste
        shell: pwsh
        run: |
          Get-NetFirewallProfile | Select-Object Name,@{Name='Enabled';Expression={ [string]$_.Enabled -eq 'True' }} | ConvertTo-Json | Set-Content work/firewall-before.json
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
      - name: Medir otimizacoes controladas
        run: python scripts/measure_optimizations.py
      - name: Testar ONEDIR Windows real
        id: onedir
        continue-on-error: true
        run: python scripts/test_windows_distribution.py --format onedir --model work/tiny.gguf --mcp-fixture work/smoke-tools/mcp-fixture.exe
      - name: Testar ONEFILE Windows real
        id: onefile
        continue-on-error: true
        run: python scripts/test_windows_distribution.py --format onefile --model work/tiny.gguf --mcp-fixture work/smoke-tools/mcp-fixture.exe
      - name: Exigir aprovacao dos dois formatos e verificar intercambio
        shell: pwsh
        run: |
          if ('${{ steps.onedir.outcome }}' -ne 'success' -or '${{ steps.onefile.outcome }}' -ne 'success') { throw 'Uma distribuicao falhou; atualizacao nao aprovada' }
          python scripts/finalize_windows_report.py
          if ($LASTEXITCODE -ne 0) { throw 'Paridade ou intercambio de dados falhou' }
          python scripts/verify_package.py
          if ($LASTEXITCODE -ne 0) { throw 'Hashes finais falharam' }
      - uses: actions/upload-artifact@v4
        with:
          name: Central-IA-Studio-Windows-x64
          path: work/artifacts/onedir/
      - uses: actions/upload-artifact@v4
        with:
          name: Central-IA-Studio-ONEFILE-Windows-x64
          path: work/artifacts/onefile/
      - uses: actions/upload-artifact@v4
        with:
          name: Central-IA-Studio-Fontes-e-Documentacao
          path: work/artifacts/sources/
      - uses: actions/upload-artifact@v4
        with:
          name: Central-Engine-Windows-x64-CPU
          path: work/engine-package/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Diagnostico-dos-testes-Windows
          path: |
            work/test-*.json
            work/optimization-measurements.json
            work/smoke */**/*.log
            work/smoke */**/*.png
            TEST_RESULTS.json
            BUILD_REPORT.json
      - name: Restaurar perfis de firewall do runner
        if: always()
        shell: pwsh
        run: |
          if (Test-Path work/firewall-before.json) {
            foreach ($firewallProfile in (Get-Content work/firewall-before.json -Raw | ConvertFrom-Json)) {
              $enabledValue = if ([Convert]::ToBoolean($firewallProfile.Enabled)) { 'True' } else { 'False' }
              Set-NetFirewallProfile -Profile $firewallProfile.Name -Enabled $enabledValue
            }
          }
